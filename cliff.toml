# git-cliff: CHANGELOG.md sections from Conventional Commits.
# Run through `just changelog` (see justfile), which prefers a local git-cliff
# and falls back to `uvx git-cliff`. Sections for v1.2.0..v2.0.0 were seeded by
# hand from the tag history; future releases render with this config.

[changelog]
header = ""
body = """
{%- if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope and commit.scope != "security" %}{{ commit.scope }}: {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/edgar971/ha-litellm-conversation/commit/{{ commit.id }})){% if commit.breaking %} **breaking**{% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Pre-v1.2 history predates the convention; don't fail a run over it, skip it.
filter_unconventional = true
sort_commits = "newest"

commit_parsers = [
  { message = "^feat!|!:", group = "<!-- 0 -->Breaking" },
  # A security change is marked by its scope: `fix(security): …`.
  { message = "^[a-z]+\\(security\\)", group = "<!-- 1 -->Security" },
  { message = "^feat", group = "<!-- 2 -->Added" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^(perf|refactor)", group = "<!-- 4 -->Changed" },
  { message = "^revert", group = "<!-- 5 -->Removed" },
  { message = "^(docs|ci|build|test|chore|style)", skip = true },
]
