rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom actions provided (the remember/forget/dream services were removed in v2.0.0).
  appropriate-polling:
    status: done
    comment: Spend/budget sensors share one DataUpdateCoordinator polling /key/info every 15 min; daily counters stay event-driven.
  brands:
    status: done
    comment: Local brand assets shipped at custom_components/litellm_conversation/brand/.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom service actions provided.
  docs-triggers:
    status: exempt
    comment: No triggers provided.
  docs-conditions:
    status: exempt
    comment: No conditions provided.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: exempt
    comment: Only polling entities are coordinator-backed (single shared fetch); request-driven entities need no throttling.
  reauthentication-flow: done
  test-coverage: done
